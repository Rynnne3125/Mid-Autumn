<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đêm Hội Trăng Rằm 3D - Cây Hoa Anh Đào & Đèn Trời Ước Nguyện</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-w_76p4j3.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CA8r8X9f.css">
</head>
<body>
  <!-- Canvas 3D -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Màn hình tải nhanh (Loader) -->
  <div id="loader" class="loader-overlay">
    <div class="lantern-loader-flame">
      <div class="flame-core"></div>
    </div>
    <p class="loader-text">Đang thắp sáng những ngọn đèn ước nguyện...</p>
  </div>

  <!-- UI Tối Giản: Modal & Thanh ghi chú ở dưới cùng -->
  <div class="ui-minimal-overlay">
    <!-- Modal Xem Lời Chúc Khi Click Lồng Đèn -->
    <div id="modal-lantern-wish" class="modal-overlay hidden">
      <div class="modal-card wish-card-theme">
        <button id="btn-close-lantern-wish" class="btn-close" aria-label="Đóng">✕</button>
        <div id="wish-modal-sticker" class="wish-sticker-container"></div>
        <div class="golden-divider"></div>
        <p id="wish-modal-content" class="wish-poem-content">
          Nội dung lời chúc...
        </p>
        <div class="modal-actions-center">
          <button id="btn-copy-lantern-wish" class="gold-gradient-btn">✨ Sao Chép Lời Chúc</button>
        </div>
      </div>
    </div>

    <!-- Modal Điền Lời Chúc Để Cô Bé Thả Đèn -->
    <div id="modal-wish-input" class="modal-overlay hidden">
      <div class="modal-card wish-card-theme">
        <button id="btn-close-wish-input" class="btn-close" aria-label="Đóng">✕</button>
        <div id="input-modal-sticker" class="wish-sticker-container"></div>
        <h2 class="modal-wish-title">🏮 Gửi Ước Nguyện Lên Trời</h2>
        <div class="golden-divider"></div>
        <p class="modal-wish-subtitle">Viết tâm nguyện của bạn vào chiếc lồng đèn trên tay cô bé:</p>
        <textarea id="textarea-girl-wish" maxlength="160" rows="3" placeholder="Nhập lời chúc hoặc ước nguyện của bạn (ví dụ: Chúc gia đình luôn bình an, mạnh khỏe và hạnh phúc viên mãn)..."></textarea>
        <div class="modal-actions-center" style="margin-top: 16px;">
          <button id="btn-confirm-release-lantern" class="gold-gradient-btn">🚀 Thắp Sáng & Thả Đèn</button>
        </div>
      </div>
    </div>

    <!-- Thông báo ngắn (Toast) -->
    <div id="toast" class="toast hidden"></div>

    <!-- Dòng ghi chú dưới cùng màn hình: xem lời chúc & chạm cô bé thả đèn -->
    <footer class="bottom-bar">
      <div class="bottom-hint-note">
        <span class="icon">🏮</span> Chạm lồng đèn để xem lời chúc &nbsp;•&nbsp; <span class="icon">👧</span> Chạm cô bé để thả đèn ước nguyện
      </div>
    </footer>
  </div>

</body>
</html>
