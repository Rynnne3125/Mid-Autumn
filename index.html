<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đêm Hội Trăng Rằm 3D - Cây Hoa Anh Đào & Đèn Trời Ước Nguyện</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- Canvas 3D -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Màn hình tải nhanh (Loader) -->
  <div id="loader" class="loader-overlay">
    <div class="lantern-loader-flame">
      <div class="flame-core"></div>
    </div>
    <p class="loader-text">Đang thắp sáng những ngọn đèn ước nguyện...</p>
  </div>

  <!-- UI Tối Giản: Duy nhất 1 thanh ghi chú ở dưới cùng -->
  <div class="ui-minimal-overlay">
    <!-- Modal Xem Lời Chúc Khi Click Lồng Đèn -->
    <div id="modal-lantern-wish" class="modal-overlay hidden">
      <div class="modal-card wish-card-theme">
        <button id="btn-close-lantern-wish" class="btn-close" aria-label="Đóng">✕</button>
        <div class="wish-badge" id="wish-modal-category">🏮 Đèn Ước Nguyện</div>
        <h2 id="wish-modal-title" class="wish-title">Đoàn Viên Sum Vầy</h2>
        <div class="golden-divider"></div>
        <p id="wish-modal-content" class="wish-poem-content">
          Nội dung lời chúc...
        </p>
        <div class="modal-actions-center">
          <button id="btn-copy-lantern-wish" class="gold-gradient-btn">✨ Sao Chép Lời Chúc</button>
        </div>
      </div>
    </div>

    <!-- Thông báo ngắn (Toast) -->
    <div id="toast" class="toast hidden"></div>

    <!-- Dòng ghi chú duy nhất dưới cùng màn hình theo đúng yêu cầu -->
    <footer class="bottom-bar">
      <div class="bottom-hint-note">
        <span class="icon">🏮</span> Chạm vào lồng đèn để xem lời chúc
      </div>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
